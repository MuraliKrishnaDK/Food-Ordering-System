<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">FoodDoor</h1>
    <p class="auth-subtitle">Reset your password</p>

    <div class="auth-message error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="auth-message success" *ngIf="message">{{ message }}</div>

    <form name="form" #f="ngForm" (ngSubmit)="f.form.valid && submit()" novalidate class="auth-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email"
               id="email"
               class="form-control"
               name="email"
               placeholder="Enter your registered email"
               [(ngModel)]="email"
               #emailField="ngModel"
               [ngClass]="{ 'is-invalid': f.submitted && emailField.invalid }"
               required />
        <div *ngIf="f.submitted && emailField.invalid" class="field-error">
          <div *ngIf="emailField.errors?.required">Email is required.</div>
        </div>
      </div>

      <div class="auth-actions">
        <button type="button" class="bigbutton auth-pill-btn auth-btn-outline" routerLink="/login">
          <span>Back</span>
        </button>
        <button type="submit" class="bigbutton auth-pill-btn" [disabled]="loading">
          <span>{{ loading ? 'Sending...' : 'Send Code' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
