<div class="loginbody">
  <br><br>
  <H1 align="center">FoodDoor</H1>
  <br>
  <h3 align="center">Reset your password</h3>
  <br>

  <div *ngIf="errorMessage" align="center" style="color: #f44336; margin-bottom: 10px;">
    {{ errorMessage }}
  </div>
  <div *ngIf="message" align="center" style="color: #4caf50; margin-bottom: 10px;">
    {{ message }}
  </div>

  <div class="container" align="center">
    <div class="row">
      <div class="offset-3"></div>
      <div class="col-md-6">
        <form name="form" #f="ngForm" (ngSubmit)="f.form.valid && submit()" novalidate class="feedback-form">

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email"
                   id="email"
                   class="form-control"
                   name="email"
                   placeholder="Enter your registered email"
                   [(ngModel)]="email"
                   #emailField="ngModel"
                   [ngClass]="{ 'is-invalid': f.submitted && emailField.invalid }"
                   required />
            <div *ngIf="f.submitted && emailField.invalid" class="invalid-input">
              <div *ngIf="emailField.errors?.required">Email is required.</div>
            </div>
          </div>

          <div class="auth-actions">
            <button type="submit" class="bigbutton auth-pill-btn" [disabled]="loading">
              <span>{{ loading ? 'Sending...' : 'Send Code' }}</span>
            </button>
            <button type="button" class="bigbutton auth-pill-btn" routerLink="/login">
              <span>Back</span>
            </button>
          </div>

        </form>
      </div>
      <div class="offset-3"></div>
    </div>
  </div>
</div>
