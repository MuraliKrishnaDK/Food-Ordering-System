<div class="body mm-page">
  <h1 class="mm-title">Manage Menu</h1>

  <div *ngIf="successMessage" class="alert-msg success-msg">{{ successMessage }}</div>
  <div *ngIf="errorMessage"   class="alert-msg error-msg">{{ errorMessage }}</div>

  <div *ngIf="loading" class="mm-loading">Loading items…</div>

  <div *ngIf="!loading && model.length === 0" class="mm-empty">
    No items yet. <a routerLink="/addItem">Add your first item.</a>
  </div>

  <div class="mm-grid" *ngIf="!loading && model.length > 0">
    <div class="mm-card" *ngFor="let m of model">

      <!-- ── VIEW MODE ── -->
      <ng-container *ngIf="editingId !== m.id">
        <img class="mm-img" [src]="sanitizer.bypassSecurityTrustUrl(m.url)" [alt]="m.item"
             onerror="this.src='assets/menu-images/default.jpeg'" />
        <div class="mm-info">
          <h3 class="mm-item-name">{{ m.item }}</h3>
          <p class="mm-meta">Price: <strong>${{ m.price }}</strong></p>
          <p class="mm-meta">Qty Available: <strong>{{ m.quantity }}</strong></p>
        </div>
        <div class="mm-actions">
          <button class="mm-btn edit-btn" (click)="startEdit(m)">✏ Edit</button>
          <button class="mm-btn delete-btn" (click)="confirmDelete(m.id)">🗑 Delete</button>
        </div>
      </ng-container>

      <!-- ── EDIT MODE ── -->
      <ng-container *ngIf="editingId === m.id">
        <div class="edit-form">
          <label class="edit-lbl">Item Name</label>
          <input class="edit-inp" type="text" [(ngModel)]="editForm.item" maxlength="45" />

          <label class="edit-lbl">Price ($)</label>
          <input class="edit-inp" type="number" [(ngModel)]="editForm.price" min="0" />

          <label class="edit-lbl">Quantity Available</label>
          <input class="edit-inp" type="number" [(ngModel)]="editForm.quantity" min="0" />

          <label class="edit-lbl">Image URL</label>
          <input class="edit-inp" type="text" [(ngModel)]="editForm.url" maxlength="120" />

          <div class="edit-btns">
            <button class="mm-btn save-btn" (click)="saveEdit(m)" [disabled]="saving">
              {{ saving ? 'Saving…' : '✓ Save' }}
            </button>
            <button class="mm-btn cancel-btn" (click)="cancelEdit()" [disabled]="saving">✕ Cancel</button>
          </div>
        </div>
      </ng-container>

      <!-- ── DELETE CONFIRM ── -->
      <div class="delete-overlay" *ngIf="deleteConfirmId === m.id" (click)="cancelDelete()">
        <div class="delete-dialog" (click)="$event.stopPropagation()">
          <p>Delete <strong>{{ m.item }}</strong>? This cannot be undone.</p>
          <div class="delete-dialog-btns">
            <button class="mm-btn cancel-btn" (click)="cancelDelete()" [disabled]="deleting">Cancel</button>
            <button class="mm-btn delete-btn" (click)="deleteItem(m)" [disabled]="deleting">
              {{ deleting ? 'Deleting…' : 'Yes, Delete' }}
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="mm-footer-actions">
    <button class="bigbutton mm-add-btn" routerLink="/addItem"><span>+ Add New Item</span></button>
  </div>
</div>
