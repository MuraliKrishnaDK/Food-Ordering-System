<div class="auth-page">
  <div class="auth-card auth-card-wide">
    <h1 class="auth-title">Sign Up</h1>
    <p class="auth-subtitle">Create your FoodDoor account</p>

    <div *ngIf="present" class="auth-alert error">Username already taken!</div>
    <div *ngIf="present === false" class="auth-alert success">Username available!</div>

    <form name="form" #f="ngForm" (ngSubmit)="onSubmit(f)" novalidate class="auth-form">
      <div class="form-row">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text"
                 id="username"
                 class="form-control has-action"
                 name="username"
                 placeholder="Your username"
                 [(ngModel)]="model.username"
                 #username="ngModel"
                 [ngClass]="{ 'is-invalid': f.submitted && username.invalid }"
                 required />
          <button type="button" class="input-action-btn check-btn" (click)="usernamePresent()" title="Check availability">
            <i class="fa fa-check-circle"></i>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password"
                 id="password"
                 class="form-control has-action"
                 name="password"
                 placeholder="Your password"
                 (keyup)="passwordStrength()"
                 [(ngModel)]="model.password"
                 #password="ngModel"
                 minlength="8"
                 maxlength="16"
                 [ngClass]="{ 'is-invalid': f.submitted && password.invalid }"
                 required />
          <span *ngIf="!passwordValidation" class="input-action-btn field-hint-icon" title="8–16 chars, 1 uppercase, 1 number, 1 special character">
            <i class="fa fa-info-circle"></i>
          </span>
        </div>
      </div>

      <div class="form-row">
        <label for="firstname">First name</label>
        <input type="text"
               id="firstname"
               class="form-control"
               name="firstname"
               placeholder="Your first name"
               [(ngModel)]="model.firstname"
               #firstname="ngModel"
               [ngClass]="{ 'is-invalid': f.submitted && firstname.invalid }"
               required />
      </div>

      <div class="form-row">
        <label for="lastname">Last name</label>
        <input type="text"
               id="lastname"
               class="form-control"
               name="lastname"
               placeholder="Your last name"
               [(ngModel)]="model.lastname"
               #lastname="ngModel"
               [ngClass]="{ 'is-invalid': f.submitted && lastname.invalid }"
               required />
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input type="text"
               id="email"
               class="form-control"
               name="email"
               placeholder="email@example.com"
               (keyup)="checkEmail()"
               [(ngModel)]="model.email"
               #email="ngModel"
               [ngClass]="{ 'is-invalid': f.submitted && email.invalid || !emailValidation }"
               required />
        <span *ngIf="!emailValidation" class="field-error">Enter a valid email address</span>
      </div>

      <div class="form-row">
        <label for="options">Account type</label>
        <select class="form-control account-select" [(ngModel)]="options" name="options" id="options">
          <option value="User">User</option>
          <option value="Merchant">Merchant</option>
        </select>
      </div>

      <div class="auth-actions">
        <button type="button" routerLink="/login" class="bigbutton auth-pill-btn auth-btn-outline"><span>Login</span></button>
        <button type="submit" class="bigbutton auth-pill-btn"><span>Sign up</span></button>
      </div>
    </form>
  </div>
</div>
