<header *ngIf="showHeader" class="app-header">
  <div class="header-content">
    <div class="header-left">
      <a routerLink="/menu" class="logo">FoodDoor</a>
      <button type="button" class="location-btn" (click)="openLocationPopup()" aria-label="Set delivery location">
        <i class="fa fa-map-marker location-pin"></i>
        <span class="location-address">{{ deliveryAddress || 'Set location' }}</span>
        <i class="fa fa-chevron-down location-chevron"></i>
      </button>
    </div>

    <nav class="header-nav">
      <a routerLink="/menu" routerLinkActive="active">Menu</a>

      <div class="user-menu-wrap">
        <span class="user-link" aria-label="Account menu">
          <i class="fa fa-user"></i>
        </span>
        <div class="user-dropdown">
          <a *ngIf="!isMerchantUser" routerLink="/welcome" class="user-dropdown-item">Profile</a>
          <a *ngIf="isMerchantUser"  routerLink="/merchantWelcome" class="user-dropdown-item">Profile</a>
          <a *ngIf="!isMerchantUser" routerLink="/orderHistory" class="user-dropdown-item">My Orders</a>
          <a routerLink="/settings" class="user-dropdown-item">Settings</a>
          <button type="button" class="user-dropdown-item user-dropdown-logout" (click)="logout()">Logout</button>
        </div>
      </div>

      <!-- Cart icon — last item, opens sidebar -->
      <button type="button" class="cart-link cart-btn" (click)="toggleCart($event)" aria-label="Open cart">
        <i class="fa fa-shopping-cart"></i>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </button>
    </nav>
  </div>
</header>

<!-- Location popup -->
<div class="location-overlay" *ngIf="showLocationPopup" (click)="closeLocationPopup()">
  <div class="location-modal" (click)="$event.stopPropagation()">
    <button type="button" class="location-close" (click)="closeLocationPopup()">✕</button>
    <h2 class="location-modal-title">Delivery location</h2>
    <p class="location-modal-sub">Enter where you'd like your order delivered.</p>

    <div class="location-field">
      <label for="locationAddress">Address</label>
      <div class="location-input-wrap">
        <input id="locationAddress" type="text"
               [(ngModel)]="locationFormAddress" />
        <button type="button"
                class="location-detect-btn"
                (click)="useCurrentLocation()"
                [disabled]="locationLoading"
                aria-label="Use current location">
          <i class="fa fa-crosshairs" [class.spinning]="locationLoading"></i>
        </button>
      </div>
    </div>

    <button type="button" class="location-save-btn" (click)="saveLocation()">Save location</button>
  </div>
</div>

<!-- Global cart sidebar (always in DOM, hidden off-screen when closed) -->
<app-cart-sidebar></app-cart-sidebar>

<app-toast></app-toast>
<main class="app-main">
  <router-outlet></router-outlet>
</main>
<footer class="app-footer">
  <div class="footer-content">
    <div class="footer-section">
      <h4 class="footer-heading">Contact us</h4>
      <ul class="footer-links">
        <li><a routerLink="/contactUs">Help & Support</a></li>
        <li><a href="#">Partner With Us</a></li>
        <li><a href="#">Ride With Us</a></li>
      </ul>
    </div>
    <div class="footer-section">
      <h4 class="footer-heading">Legal</h4>
      <ul class="footer-links">
        <li><a href="#">Terms & Conditions</a></li>
        <li><a href="#">Cookie Policy</a></li>
        <li><a href="#">Privacy Policy</a></li>
      </ul>
    </div>
  </div>
</footer>
