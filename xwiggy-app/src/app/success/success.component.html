<div class="body success-page">

  <div class="success-card">
    <div class="success-icon">✓</div>
    <h1 class="success-title">Payment Successful!</h1>

    <div *ngIf="saving" class="saving-msg">Saving your order…</div>

    <div *ngIf="!saving && orderId" class="order-ref">
      Order <strong>#{{ orderId }}</strong> placed successfully.
    </div>

    <!-- Order status tracker -->
    <div class="tracker">
      <div class="tracker-step active">
        <div class="step-dot filled"></div>
        <div class="step-label">Order Placed</div>
      </div>
      <div class="tracker-line"></div>
      <div class="tracker-step">
        <div class="step-dot"></div>
        <div class="step-label">Confirmed</div>
      </div>
      <div class="tracker-line"></div>
      <div class="tracker-step">
        <div class="step-dot"></div>
        <div class="step-label">Preparing</div>
      </div>
      <div class="tracker-line"></div>
      <div class="tracker-step">
        <div class="step-dot"></div>
        <div class="step-label">On the Way</div>
      </div>
      <div class="tracker-line"></div>
      <div class="tracker-step">
        <div class="step-dot"></div>
        <div class="step-label">Delivered</div>
      </div>
    </div>

    <p class="eta-msg">🕐 Estimated delivery time: <strong>30–45 minutes</strong></p>

    <div class="success-actions">
      <button class="bigbutton action-btn" (click)="goToHistory()">
        <span>Track Order</span>
      </button>
      <button class="bigbutton action-btn secondary-btn" (click)="goToMenu()">
        <span>Back to Menu</span>
      </button>
      <button class="bigbutton action-btn secondary-btn" routerLink="/contactUs">
        <span>Contact Us</span>
      </button>
    </div>
  </div>

</div>
