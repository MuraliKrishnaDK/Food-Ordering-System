<!-- Backdrop -->
<div class="sidebar-backdrop" *ngIf="isOpen" (click)="close()"></div>

<!-- Sliding panel -->
<div class="cart-sidebar" [class.open]="isOpen" role="dialog" aria-label="Cart">

  <!-- Header -->
  <div class="sidebar-header">
    <div class="sidebar-title-wrap">
      <i class="fa fa-shopping-cart sidebar-cart-icon"></i>
      <h2 class="sidebar-title">Your Cart</h2>
    </div>
    <button class="sidebar-close" (click)="close()" aria-label="Close cart">✕</button>
  </div>

  <!-- Empty state -->
  <div class="sidebar-empty" *ngIf="lineItems.length === 0">
    <div class="empty-icon">🛒</div>
    <p class="empty-text">Your cart is empty</p>
    <p class="empty-sub">Add items from the menu to get started</p>
    <button class="btn-browse" (click)="close()">Browse Menu</button>
  </div>

  <!-- Items list -->
  <div class="sidebar-items" *ngIf="lineItems.length > 0">
    <div class="sidebar-item" *ngFor="let item of lineItems">
      <div class="item-qty-bubble">{{ item.quantity }}</div>
      <div class="item-details">
        <span class="item-name">{{ item.name }}</span>
        <span class="item-unit-price">${{ item.unitPrice.toFixed(2) }} each</span>
      </div>
      <div class="item-right">
        <span class="item-line-total">${{ item.lineTotal.toFixed(2) }}</span>
        <button class="item-remove" (click)="removeItem(item)" aria-label="Remove item">
          <i class="fa fa-trash"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="sidebar-footer" *ngIf="lineItems.length > 0">
    <div class="sidebar-subtotal">
      <span>Subtotal</span>
      <span class="subtotal-value">${{ grandTotal.toFixed(2) }}</span>
    </div>
    <p class="sidebar-footnote">Taxes and fees calculated at checkout</p>
    <button class="btn-checkout" (click)="checkout()">
      Go to Checkout → ${{ grandTotal.toFixed(2) }}
    </button>
  </div>

</div>
