<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">FoodDoor</h1>
    <p class="auth-subtitle">Sign in to your account</p>

    <div class="auth-message error" *ngIf="message">{{ message }}</div>

    <form name="form" #f="ngForm" (ngSubmit)="f.form.valid && sendFeedback()" novalidate class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text"
               id="username"
               class="form-control"
               name="username"
               placeholder="Enter your username"
               [(ngModel)]="model.username"
               #username="ngModel"
               [ngClass]="{ 'is-invalid': f.submitted && username.invalid }"
               required />
        <div *ngIf="f.submitted && username.invalid" class="field-error">
          <div *ngIf="username.errors?.required">Username is required</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password"
               id="password"
               class="form-control"
               name="password"
               placeholder="Enter your password"
               [(ngModel)]="model.password"
               #password="ngModel"
               [ngClass]="{ 'is-invalid': f.submitted && password.invalid }"
               required />
        <div *ngIf="f.submitted && password.invalid" class="field-error">
          <div *ngIf="password.errors?.required">Password is required</div>
        </div>
      </div>

      <div class="form-group remember-row">
        <label class="remember-label">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          <span>Remember me</span>
        </label>
      </div>

      <div class="auth-actions">
        <button type="submit" class="bigbutton auth-pill-btn"><span>Sign in</span></button>
        <button type="button" class="bigbutton auth-pill-btn" routerLink="/register"><span>Sign up</span></button>
      </div>

      <div class="auth-footer-link">
        <a routerLink="/forgotPassword">Forgot your password?</a>
      </div>
    </form>
  </div>
</div>
