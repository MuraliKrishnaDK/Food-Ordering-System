<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">FoodDoor</h1>
    <p class="auth-subtitle">Enter your reset code</p>
    <p class="auth-hint">A 6-digit code was sent to <strong>{{ email }}</strong></p>

    <div class="auth-message error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="auth-message success" *ngIf="message">{{ message }}</div>

    <form name="form" #f="ngForm" (ngSubmit)="f.form.valid && submit()" novalidate class="auth-form">
      <div class="form-group">
        <label for="code">Reset Code</label>
        <input type="text"
               id="code"
               class="form-control"
               name="code"
               placeholder="6-digit code"
               [(ngModel)]="code"
               #codeField="ngModel"
               maxlength="6"
               [ngClass]="{ 'is-invalid': f.submitted && codeField.invalid }"
               required />
        <div *ngIf="f.submitted && codeField.invalid" class="field-error">
          <div *ngIf="codeField.errors?.required">Code is required.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password"
               id="newPassword"
               class="form-control"
               name="newPassword"
               placeholder="Minimum 8 characters"
               [(ngModel)]="newPassword"
               #newPwdField="ngModel"
               minlength="8"
               [ngClass]="{ 'is-invalid': f.submitted && newPwdField.invalid }"
               required />
        <div *ngIf="f.submitted && newPwdField.invalid" class="field-error">
          <div *ngIf="newPwdField.errors?.required">Password is required.</div>
          <div *ngIf="newPwdField.errors?.minlength">Minimum 8 characters.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password"
               id="confirmPassword"
               class="form-control"
               name="confirmPassword"
               placeholder="Repeat new password"
               [(ngModel)]="confirmPassword"
               #confirmPwdField="ngModel"
               [ngClass]="{ 'is-invalid': f.submitted && confirmPwdField.invalid }"
               required />
        <div *ngIf="f.submitted && confirmPwdField.invalid" class="field-error">
          <div *ngIf="confirmPwdField.errors?.required">Please confirm your password.</div>
        </div>
      </div>

      <div class="auth-actions">
        <button type="button" class="bigbutton auth-pill-btn auth-btn-outline" routerLink="/forgotPassword">
          <span>Back</span>
        </button>
        <button type="submit" class="bigbutton auth-pill-btn" [disabled]="loading">
          <span>{{ loading ? 'Saving...' : 'Reset Password' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
