<div class="loginbody">
  <br><br>
  <H1 align="center">FoodDoor</H1>
  <br>
  <h3 align="center">Enter your reset code</h3>
  <p align="center" class="hint">A 6-digit code was sent to <strong>{{ email }}</strong></p>
  <br>

  <div *ngIf="errorMessage" align="center" style="color: #f44336; margin-bottom: 10px;">
    {{ errorMessage }}
  </div>
  <div *ngIf="message" align="center" style="color: #4caf50; margin-bottom: 10px;">
    {{ message }}
  </div>

  <div class="container" align="center">
    <div class="row">
      <div class="offset-3"></div>
      <div class="col-md-6">
        <form name="form" #f="ngForm" (ngSubmit)="f.form.valid && submit()" novalidate class="feedback-form">

          <!-- Code -->
          <div class="form-group">
            <label for="code">Reset Code</label>
            <input type="text"
                   id="code"
                   class="form-control"
                   name="code"
                   placeholder="6-digit code"
                   [(ngModel)]="code"
                   #codeField="ngModel"
                   maxlength="6"
                   [ngClass]="{ 'is-invalid': f.submitted && codeField.invalid }"
                   required />
            <div *ngIf="f.submitted && codeField.invalid" class="invalid-input">
              <div *ngIf="codeField.errors?.required">Code is required.</div>
            </div>
          </div>

          <!-- New Password -->
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password"
                   id="newPassword"
                   class="form-control"
                   name="newPassword"
                   placeholder="Minimum 8 characters"
                   [(ngModel)]="newPassword"
                   #newPwdField="ngModel"
                   minlength="8"
                   [ngClass]="{ 'is-invalid': f.submitted && newPwdField.invalid }"
                   required />
            <div *ngIf="f.submitted && newPwdField.invalid" class="invalid-input">
              <div *ngIf="newPwdField.errors?.required">Password is required.</div>
              <div *ngIf="newPwdField.errors?.minlength">Minimum 8 characters.</div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password"
                   id="confirmPassword"
                   class="form-control"
                   name="confirmPassword"
                   placeholder="Repeat new password"
                   [(ngModel)]="confirmPassword"
                   #confirmPwdField="ngModel"
                   [ngClass]="{ 'is-invalid': f.submitted && confirmPwdField.invalid }"
                   required />
            <div *ngIf="f.submitted && confirmPwdField.invalid" class="invalid-input">
              <div *ngIf="confirmPwdField.errors?.required">Please confirm your password.</div>
            </div>
          </div>

          <div class="auth-actions">
            <button type="submit" class="bigbutton auth-pill-btn" [disabled]="loading">
              <span>{{ loading ? 'Saving...' : 'Reset Password' }}</span>
            </button>
            <button type="button" class="bigbutton auth-pill-btn" routerLink="/forgotPassword">
              <span>Back</span>
            </button>
          </div>

        </form>
      </div>
      <div class="offset-3"></div>
    </div>
  </div>
</div>
