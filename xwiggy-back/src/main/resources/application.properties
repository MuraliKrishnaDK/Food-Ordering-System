spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
AES.Key=Bar12345Bar12345
fileStorage=/assets

# Server port — Railway/Render inject PORT automatically
server.port=${PORT:8080}

# Database — uses env vars when deployed, falls back to local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myusers}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Brevo transactional email API (preferred on Render — set BREVO_API_KEY + BREVO_SENDER_EMAIL)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:FoodDoor}

# SMTP fallback (e.g. Brevo SMTP relay) — only needed if not using the API key above
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
